name: Retention cleanup
on:
  schedule:
    - cron: '35 0 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Run authenticated daily retention cleanup
        env:
          BIRTHDAY_NOTIFY_URL: ${{ secrets.BIRTHDAY_NOTIFY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BIRTHDAY_NOTIFY_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure BIRTHDAY_NOTIFY_URL and CRON_SECRET first."
            exit 1
          fi
          case "$BIRTHDAY_NOTIFY_URL" in
            https://*/notify-birthdays/cron) ;;
            *) echo "Expected an HTTPS birthday cron endpoint."; exit 1 ;;
          esac
          RETENTION_URL="${BIRTHDAY_NOTIFY_URL%/notify-birthdays/cron}/retention/cron"
          curl --fail-with-body --silent --show-error --max-time 45 --retry 2 \
            -X POST "$RETENTION_URL" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{}'
