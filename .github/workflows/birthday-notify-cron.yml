name: Birthday Notification Cron

on:
  schedule:
    # Runs daily at 00:05 UTC
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional target date (YYYY-MM-DD). Leave blank for today.'
        required: false
        type: string

jobs:
  notify-birthdays:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          BIRTHDAY_NOTIFY_URL: ${{ secrets.BIRTHDAY_NOTIFY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BIRTHDAY_NOTIFY_URL" ]; then
            echo "Missing repository secret: BIRTHDAY_NOTIFY_URL"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "Missing repository secret: CRON_SECRET"
            exit 1
          fi

      - name: Trigger birthday notification endpoint
        env:
          BIRTHDAY_NOTIFY_URL: ${{ secrets.BIRTHDAY_NOTIFY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            BODY=$(printf '{"date":"%s"}' "$INPUT_DATE")
          else
            BODY='{}'
          fi

          echo "Calling $BIRTHDAY_NOTIFY_URL"
          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$BIRTHDAY_NOTIFY_URL" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d "$BODY")

          echo "HTTP status: $HTTP_CODE"
          cat response.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Birthday notification cron failed"
            exit 1
          fi

  email-on-failure:
    needs: notify-birthdays
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure alert email (Resend)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_EMAIL_TO" ] || [ -z "$ALERT_EMAIL_FROM" ]; then
            echo "Skipping failure email. Missing one or more secrets: RESEND_API_KEY, ALERT_EMAIL_TO, ALERT_EMAIL_FROM"
            exit 0
          fi

          SUBJECT="[WishCanvas] Birthday cron failed"
          TEXT="Birthday notification cron failed. Repository: ${REPO}. Run details: ${RUN_URL}"

          HTTP_CODE=$(curl -sS -o /tmp/resend-response.json -w "%{http_code}" \
            -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"${ALERT_EMAIL_FROM}\",\"to\":[\"${ALERT_EMAIL_TO}\"],\"subject\":\"${SUBJECT}\",\"text\":\"${TEXT}\"}"
          )

          echo "Resend HTTP status: ${HTTP_CODE}"
          cat /tmp/resend-response.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Failed to send failure email"
            exit 1
          fi